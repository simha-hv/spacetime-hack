<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cast — Rooftop Rumble</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2440; }
      canvas { display: block; width: 100%; height: 100%; }
      #hint {
        position: fixed; left: 16px; bottom: 12px;
        font: 13px ui-monospace, monospace; color: #93a0c0;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hint">the six species, same lights and materials the game uses · ?pose=idle|run|punch|reach|flail · ?view=front|side|back</div>
    <script type="importmap">
      { "imports": { "three": "./three.module.js", "three/webgpu": "./three.module.js" } }
    </script>
    <script type="module">
      /*
       * A flat lineup of the whole cast at close range.
       *
       * The in-game camera sits ten-plus metres back, which is exactly the
       * distance at which a silhouette problem is visible but its cause is not.
       * This renders the same `buildAnimal` output under the same lights, close
       * enough to see which shape is actually wrong.
       */
      import * as THREE from 'three';
      import { SPECIES, buildAnimal, POSES, blendPose } from './cast-animal.js';
      import { Effects } from './cast-effects.js';

      const params = new URLSearchParams(location.search);
      const poseName = params.get('pose') ?? 'idle';
      const view = params.get('view') ?? 'front';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#1b2440');

      const key = new THREE.DirectionalLight('#fff0d8', 2.5);
      key.position.set(4, 8, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0012;
      Object.assign(key.shadow.camera, { left: -8, right: 8, top: 6, bottom: -3, near: 1, far: 30 });
      key.shadow.camera.updateProjectionMatrix();
      scene.add(key);
      scene.add(new THREE.HemisphereLight('#9fc4ff', '#4a3f52', 1.35));

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: '#6a6f7d', roughness: 0.95 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const COLORS = ['#ff5a5f', '#4d8dff', '#3ddc84', '#ffd23d', '#c46bff', '#ff9e3d'];
      const animals = SPECIES.map((s, i) => {
        const a = buildAnimal(s.id, COLORS[i % COLORS.length]);
        a.root.position.set((i - (SPECIES.length - 1) / 2) * 1.5, 0, 0);
        a.root.scale.setScalar(s.bulk);
        if (view === 'side') a.root.rotation.y = Math.PI / 2;
        if (view === 'back') a.root.rotation.y = Math.PI;
        scene.add(a.root);
        return { ...a, species: s };
      });

      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
      const resize = () => {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };
      addEventListener('resize', resize);
      resize();
      camera.position.set(0, 1.6, 8.4);
      camera.lookAt(0, 0.95, 0);

      /*
       * Impact bursts, on demand.
       *
       * A 300ms effect that only fires on a connect is close to impossible to
       * catch in a screenshot of a live match, so it was going unreviewed. Here
       * it fires on a timer, at chest height on each animal in turn, at the
       * distance where you can actually judge whether it reads.
       */
      const fx = params.get('fx') === '1' ? new Effects(scene) : null;
      let fxTimer = 0;
      let fxIndex = 0;

      let t = 0;
      let last = performance.now();
      renderer.setAnimationLoop(() => {
        const now = performance.now();
        const dtMs = Math.min(now - last, 100);
        last = now;
        t += 1 / 60;

        for (const a of animals) {
          const pose = POSES[poseName] ?? POSES.idle;
          blendPose(a.joints, (j) => pose(j, t), 0.3);
        }

        if (fx) {
          fxTimer -= dtMs;
          if (fxTimer <= 0) {
            fxTimer = 520;
            const a = animals[fxIndex % animals.length];
            fxIndex++;
            fx.burst(a.root.position.x, 1.0, 0.45, (fxIndex % 3) / 2);
          }
          fx.update(dtMs);
        }

        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
